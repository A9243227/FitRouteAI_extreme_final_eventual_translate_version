[project]
name = "fitrouteai"
version = "0.1.0"
description = "FitRouteAI — 智慧自行車運動智能助手"
readme = "README.md"
# README 記載開發環境為 Python 3.10.16
requires-python = ">=3.10,<3.11"

dependencies = [
    # --- Web 框架 ---
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-cors>=5.0",
    "python-dotenv>=1.0",       # 注意：套件名是 python-dotenv，不是 dotenv
    "requests>=2.31",
    "colorama>=0.4.6",          # app.py 的彩虹貓動畫用

    # --- LLM ---
    "llama-cpp-python>=0.3.2",  # 載入 model/gemma-3-4b-it-Q4_K_M.gguf

    # --- 模型與數值運算 ---
    # model/xgb_model.pkl 是用 XGBoost 2.1.4 序列化的。
    # XGBoost 不保證 pickle 跨大版本相容，因此鎖在同一版；
    # 若日後改用 Booster.save_model() 輸出 .json/.ubj，這裡就能放寬。
    "xgboost==2.1.4",
    "joblib>=1.3",              # 讀取 model/xgb_model.pkl
    "pandas>=2.0",              # utils/simulation.py 組 DataFrame
    "numpy>=1.26",
    "scipy>=1.11",              # utils/pacing_opt.py 的 make_interp_spline
    "matplotlib>=3.8",          # 配速策略圖（Agg backend）
]

[tool.uv]
# 這是應用程式而不是函式庫，不需要把專案本身也 build/install 進虛擬環境
package = false

# PyPI 上的 llama-cpp-python 只有原始碼，安裝時需要 CMake + MSVC 編譯（Windows 上
# 通常會失敗在找不到 nmake / CMAKE_CXX_COMPILER）。官方另外提供預編譯的 CPU wheel，
# 這裡指定只有 llama-cpp-python 走這個 index，其他套件仍從 PyPI 取得。
# 若要改用 CUDA 版本，把網址結尾的 /cpu 換成對應的 CUDA 版本（例如 /cu124）。
[[tool.uv.index]]
name = "llama-cpp-python"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-python" }
